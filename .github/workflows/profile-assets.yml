name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate Visual Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup output directory
        run: mkdir -p dist

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github

      - name: Generate Profile Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          theme: tokyonight
          no-frame: true
          no-bg: true

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=1a1b26&stroke=7aa2f7&ring=7aa2f7&fire=9ece6a&currStreakNum=9ece6a&sideNums=bb9af7&currStreakLabel=7aa2f7&sideLabels=a9b1d6&dates=a9b1d6
          path: dist/streak.svg

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          username: ${{ github.repository_owner }}
          output: dist/activity-graph.svg
          theme: tokyonight
          bg_color: 1a1b26
          color: 7aa2f7
          line: 9ece6a
          point: bb9af7
          hide_border: true

      - name: Deploy Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generate Profile Visuals & Telemetry

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate Telemetry Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup output directory
        run: mkdir -p dist

      # 1. Contribution Grid Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github

      # 2. GitHub Profile Trophy (Tokyo Night / Minimal Frame)
      - name: Generate Profile Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          theme: tokyonight
          no-frame: true
          no-bg: true

      # 3. GitHub Readme Streak Stats
      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=1a1b26&stroke=7aa2f7&ring=7aa2f7&fire=9ece6a&currStreakNum=9ece6a&sideNums=bb9af7&currStreakLabel=7aa2f7&sideLabels=a9b1d6&dates=a9b1d6
          path: dist/streak.svg

      # 4. GitHub Readme Activity Graph
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/activity-graph.svg
          options: theme=tokyonight&hide_border=true&bg_color=1a1b26&color=7aa2f7&line=9ece6a&point=bb9af7
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Git Koi Aquarium
      - name: Generate Git Koi Aquarium
        uses: reginaldalfret/git-koi-aquarium@v1
        continue-on-error: true
        with:
          body: aquarium
          output-dir: dist

      # 6. Post-Process Koi: Scale & Map by Language Share
      - name: Scale Koi by Language Distribution
        run: |
          if [ -f dist/aquarium.svg ]; then
            python3 scripts/scale_aquarium.py dist/aquarium.svg "${{ github.repository_owner }}"
          fi

      # 7. Deploy All Generated Assets to the output Branch
      - name: Deploy Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
